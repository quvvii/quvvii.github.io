<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nothing here</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #2a2a2a;
      --text:   #f0ece4;
      --dim:    #666;
      --accent: #e8dfc8;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier Prime', 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container { text-align: center; }

    .mark, h1, a {
      opacity: 0;
      animation: fadein 0.9s ease forwards;
    }

    .mark { animation-delay: 0.1s; }
    h1    { animation-delay: 0.55s; }
    a     { animation-delay: 0.95s; }

    .mark {
      font-size: clamp(5rem, 15vw, 9rem);
      line-height: 1;
      color: var(--dim);
      margin-bottom: 1.6rem;
      display: block;
      user-select: none;
      animation: fadein 0.9s ease 0.1s forwards, levitate 4s ease-in-out 1.2s infinite;
    }

    h1 {
      font-size: clamp(1.15rem, 3vw, 1.5rem);
      font-weight: 400;
      color: var(--text);
      letter-spacing: 0.05em;
      white-space: nowrap;
      margin-bottom: 2rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-size: 1.2rem;
      letter-spacing: 0.12em;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: color 0.3s, border-color 0.3s;
      display: inline-block;
    }

    a:hover {
      color: #fff;
      border-color: var(--accent);
    }

    a::before { content: '→ '; opacity: 0.6; }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes levitate {
      0%, 100% { transform: translateY(0);    opacity: 1; }
      50%       { transform: translateY(-9px); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="mark">¿</span>
    <h1>there's genuinely nothing here.</h1>
    <a href="https://wsdy.su" rel="noopener">wsdy.su</a>
  </div>
</body>
</html>
